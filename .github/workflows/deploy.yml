name: 期货工作台早晚刷新 (GitHub Pages)

# 方案 C：GitHub Actions 定时跑数据刷新 → 构建纯静态 dist → 部署到 GitHub Pages。
# 无需常驻主机，也无需本机 / WorkBuddy 客户端在线；零后端依赖。
# Pages 产物会拆成轻量 index.html（首屏秒开）+ 独立 wb-data.<hash>.js（全量快照），
# 避免 13MB 单文件整包下载完成前一直显示「加载中…」。
#
# 时间表（schedule 固定按 UTC，括号内为北京时间 UTC+8）：
#   每日   00:47 UTC = 08:47 → opinion：机构观点 / 情绪刷新
#   工作日 10:13 UTC = 18:13 → data   ：交易所直抓数据主跑（K线/前20/仓单/全月份资金/L4打分）
# ⚠ 触发精准度说明（2026-11-17 优化）：
#   原时间点为 08:30 / 18:00，正落在整点和半点——这是 GitHub Actions 全球排队最密集的
#   时刻，实测 18:00 的定时任务曾延迟到 20:38 才触发（晚 2.5 小时）。改用 47 分 / 13 分
#   这类「错峰分钟」，可显著降低排队延迟（GitHub 官方亦建议避开 :00 / :30）。
#   GitHub schedule 是「尽力而为」，任何时间点都无法 100% 保证准点；若长时间未触发，
#   可在 Actions 页面手动 Run workflow（下方 workflow_dispatch）补跑，现已并发提速。
# 云端 CI 每次是干净检出（data/ 不入库），opinion 会自动升级为完整主跑，详见 cloud_cron.py。
#
# 数据接口：新浪主连与分月合约日线、新浪三榜持仓排名、奇货可查机构观点、东方财富前20。
# 历史累积：collect/raw_hist/ 与 collect/raw_capflow/ 缓存已纳入 git，每次跑完回写仓库。
# 周末 / 刷新失败：refresh_daily.py 按设计跳过或抓取失败时本次不产出 dist，
#   此时「准备 Pages 产物」自动改用仓库内 pages/index.html（本地最新离线快照）兜底，
#   Pages 不会失败、也不会回退到旧版本。需要周末强制主跑可手动触发并勾选 allow_weekend。
#
# 注意：本工作流只更新 GitHub 仓库与 GitHub Pages。
#       WorkBuddy 分享链接（...app.workbuddy.host）是另一套发布通道，其 web/data/
#       在发布时打包上传，云端 runner 无法触发重新发布，需由 WorkBuddy 客户端手动发布。

on:
  schedule:
    - cron: '47 0 * * *'     # 错峰 北京 08:47 每日：机构观点 / 情绪（避开 08:30 整半点拥堵）
    - cron: '13 10 * * 1-5'  # 错峰 北京 18:13 工作日：数据主跑（避开 18:00 整点拥堵）
  # 允许在 Actions 页面手动触发并选择刷新模式，便于验证
  workflow_dispatch:
    inputs:
      mode:
        description: '刷新模式（data=完整数据主跑 / opinion=观点轻量刷新 / both=全做）'
        required: true
        default: 'data'
        type: choice
        options:
          - data
          - opinion
          - both
      allow_weekend:
        description: '周末强制执行数据主跑（默认周末自动跳过）'
        required: false
        default: false
        type: boolean
  # 本地刷新后 push 自动重建 Pages
  push:
    branches: [main]

permissions:
  contents: write        # 回写 raw_hist / raw_capflow 历史缓存到仓库
  pages: write           # 部署到 GitHub Pages
  id-token: write

concurrency:
  # 按触发来源分组：定时 / 手动 / push 各自排队，互不取消。
  # 原先用单一 group + cancel-in-progress:true，导致 18:00 定时任务晚到时把正在跑的
  # 手动 run 直接取消（实测手动 run 白跑 20 分钟后被 canceled）。现在同类事件仍串行
  # （避免同时写仓库冲突），但不同来源不再互相误杀。
  group: futures-workbench-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 硬超时保护：即使某个采集脚本卡住，也在 25 分钟内结束，避免挂到 1.5 小时
    timeout-minutes: 25
    steps:
      - name: 检出仓库（含历史曲线与缓存）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取全部历史，恢复 raw_hist 曲线累积

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Node（L4 打分桥接 score_bridge.js）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        # pandas / lxml 供 pandas.read_html 解析新浪三榜；beautifulsoup4 供观点页解析
        run: pip install --upgrade pip akshare requests pandas lxml beautifulsoup4

      - name: 数据刷新 + 构建 dist
        env:
          TZ: Asia/Shanghai
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          # workflow_dispatch 的 boolean 输入为 true 时强制周末主跑；其它事件为空
          WB_ALLOW_WEEKEND: ${{ inputs.allow_weekend == true && '1' || '' }}
        run: |
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ]; then
            # 08:47 的观点定时走 opinion；其余（含 18:13 数据定时）走 data。
            # 保留对旧 cron 串的识别，便于回滚/历史 run 复现。
            case "$EVENT_SCHEDULE" in
              '47 0 * * *'|'17 0 * * *'|'30 0 * * *') MODE=opinion ;;
              *) MODE=data ;;
            esac
          fi
          echo "刷新模式=$MODE  schedule=${EVENT_SCHEDULE:-<非定时触发>}"
          python cloud_cron.py "$MODE"

      - name: 回写历史曲线数据到仓库
        # 历史缓存回写是累积性动作：运行期间若有其它 push（本地 / 自动提交）会造成
        # non-fast-forward。dist 已生成，回写失败不应阻断本次 Pages 部署，故容错 + 重试一次。
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自动刷新数据 $(TZ=Asia/Shanghai date +%F)"
          git push || (git pull --rebase origin main && git push)

      - name: 准备 Pages 产物
        run: |
          mkdir -p public
          # 选定本次部署使用的单文件离线页（本次构建 > 仓库快照 > 当前线上）
          shopt -s nullglob
          SRC=""
          files=(dist/*.html)
          if [ ${#files[@]} -gt 0 ]; then
            SRC="${files[0]}"
            echo "本次构建: $SRC"
          elif [ -s pages/index.html ]; then
            SRC="pages/index.html"
            echo "::warning::本次未生成 dist，改用仓库内 Pages 快照"
          else
            curl -fsSL "https://cockroach-workbody.github.io/futures-workbench/" -o /tmp/pages_fallback.html \
              || { echo "::error::dist 与仓库快照均不可用，Pages 无法产出"; exit 1; }
            # 线上轻量版也含 window.__WB__（仅概览），不能靠字符串判断；
            # 单文件完整版必定 > 5MB，用体积区分。
            [ "$(stat -c%s /tmp/pages_fallback.html)" -gt 5000000 ] \
              || { echo "::error::线上 Pages 为轻量版且仓库快照缺失，无法产出"; exit 1; }
            SRC="/tmp/pages_fallback.html"
            echo "::warning::改用当前线上 Pages 作为产物"
          fi
          # 拆成「轻量首屏 + ECharts 独立脚本 + 按需 gzip 品种分片」。
          # 13MB 单文件（或 11MB 同步数据脚本）在手机上要整包下载并解析成 JS 对象，
          # 常卡在「加载中…」；v3 首屏仅 0.6MB，默认品种内联，其余点开才加载约 70KB。
          if python collect/split_offline.py "$SRC" public; then
            touch public/.nojekyll
            du -sh public/index.html public/wb-p 2>/dev/null || true
          else
            echo "::warning::拆分失败，回退为单文件部署"
            cp "$SRC" public/index.html
            touch public/.nojekyll
          fi
          ls -lh public/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 失败时把编排器报告与抓取日志打包，便于直接定位是哪一步、哪个品种挂了
      - name: 上传刷新诊断日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cron-diag-${{ github.run_id }}
          path: |
            run_report.json
            collect/_run_report_*.md
            collect/_*.log
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
