name: 期货工作台早晚刷新 (GitHub Pages)

# 方案 C：GitHub Actions 定时跑数据刷新 → 构建纯静态 dist → 部署到 GitHub Pages。
# 无需常驻主机，也无需本机 / WorkBuddy 客户端在线；dist 单文件自包含，零后端依赖。
#
# 时间表（schedule 固定按 UTC，括号内为北京时间 UTC+8）：
#   每日   00:30 UTC = 08:30 → opinion：机构观点 / 情绪刷新
#   工作日 11:30 UTC = 19:30 → data   ：交易所直抓数据主跑（K线/前20/仓单/全月份资金/L4打分）
# 云端 CI 每次是干净检出（data/ 不入库），opinion 会自动升级为完整主跑，详见 cloud_cron.py。
#
# 数据接口：新浪主连与分月合约日线、新浪三榜持仓排名、奇货可查机构观点、东方财富前20。
# 历史累积：collect/raw_hist/ 与 collect/raw_capflow/ 缓存已纳入 git，每次跑完回写仓库。
# 周末 / 刷新失败：refresh_daily.py 按设计跳过或抓取失败时本次不产出 dist，
#   此时「准备 Pages 产物」自动改用仓库内 pages/index.html（本地最新离线快照）兜底，
#   Pages 不会失败、也不会回退到旧版本。需要周末强制主跑可手动触发并勾选 allow_weekend。
#
# 注意：本工作流只更新 GitHub 仓库与 GitHub Pages。
#       WorkBuddy 分享链接（...app.workbuddy.host）是另一套发布通道，其 web/data/
#       在发布时打包上传，云端 runner 无法触发重新发布，需由 WorkBuddy 客户端手动发布。

on:
  schedule:
    - cron: '30 0 * * *'      # 北京 08:30 每日：机构观点 / 情绪
    - cron: '30 11 * * 1-5'   # 北京 19:30 工作日：数据主跑
  # 允许在 Actions 页面手动触发并选择刷新模式，便于验证
  workflow_dispatch:
    inputs:
      mode:
        description: '刷新模式（data=完整数据主跑 / opinion=观点轻量刷新 / both=全做）'
        required: true
        default: 'data'
        type: choice
        options:
          - data
          - opinion
          - both
      allow_weekend:
        description: '周末强制执行数据主跑（默认周末自动跳过）'
        required: false
        default: false
        type: boolean
  # 本地刷新后 push 自动重建 Pages
  push:
    branches: [main]

permissions:
  contents: write        # 回写 raw_hist / raw_capflow 历史缓存到仓库
  pages: write           # 部署到 GitHub Pages
  id-token: write

concurrency:
  group: futures-workbench-pages
  # 连续 push 时只保留最新一次运行，避免多次刷新排队积压（每次约 5~15 分钟）
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（含历史曲线与缓存）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取全部历史，恢复 raw_hist 曲线累积

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Node（L4 打分桥接 score_bridge.js）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        # pandas / lxml 供 pandas.read_html 解析新浪三榜；beautifulsoup4 供观点页解析
        run: pip install --upgrade pip akshare requests pandas lxml beautifulsoup4

      - name: 数据刷新 + 构建 dist
        env:
          TZ: Asia/Shanghai
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          # workflow_dispatch 的 boolean 输入为 true 时强制周末主跑；其它事件为空
          WB_ALLOW_WEEKEND: ${{ inputs.allow_weekend == true && '1' || '' }}
        run: |
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ]; then
            if [ "$EVENT_SCHEDULE" = "30 0 * * *" ]; then
              MODE=opinion
            else
              MODE=data
            fi
          fi
          echo "刷新模式=$MODE  schedule=${EVENT_SCHEDULE:-<非定时触发>}"
          python cloud_cron.py "$MODE"

      - name: 回写历史曲线数据到仓库
        # 历史缓存回写是累积性动作：运行期间若有其它 push（本地 / 自动提交）会造成
        # non-fast-forward。dist 已生成，回写失败不应阻断本次 Pages 部署，故容错 + 重试一次。
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自动刷新数据 $(TZ=Asia/Shanghai date +%F)"
          git push || (git pull --rebase origin main && git push)

      - name: 准备 Pages 产物
        run: |
          mkdir -p public
          # GitHub Pages 根路径只认 index.html；把单文件网页重命名为 index.html
          shopt -s nullglob
          files=(dist/*.html)
          if [ ${#files[@]} -gt 0 ]; then
            cp "${files[0]}" public/index.html
            echo "已生成 public/index.html（本次构建: ${files[0]}）"
          elif [ -s pages/index.html ]; then
            # 周末按设计跳过刷新 / 抓取失败时本次没有新 dist，用仓库内最新
            # 离线快照兜底：Pages 不中断，也不会回退到旧版本。
            cp pages/index.html public/index.html
            echo "::warning::本次未生成 dist，改用仓库内 Pages 快照（pages/index.html）"
          else
            # 最后一层兜底：复用当前线上 Pages，绝不因产物缺失让部署失败
            curl -fsSL "https://cockroach-workbody.github.io/futures-workbench/" -o public/index.html \
              || { echo "::error::dist 与仓库快照均不可用，Pages 无法产出"; exit 1; }
            echo "::warning::改用当前线上 Pages 作为产物"
          fi
          touch public/.nojekyll
          ls -lh public/index.html

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 失败时把编排器报告与抓取日志打包，便于直接定位是哪一步、哪个品种挂了
      - name: 上传刷新诊断日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cron-diag-${{ github.run_id }}
          path: |
            run_report.json
            collect/_run_report_*.md
            collect/_*.log
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
